name: Build iOS
run-name: ${{ github.actor }} is building for Apple App Store

on:
  push:
    branches:
      - releases
      - '*-build'
  workflow_dispatch:

jobs:
  unity-build-ios:
    runs-on: macos-latest
    steps:
      # Checkout first so we can hash files for caching
      - name: Checkout git repo
        uses: actions/checkout@v5

      # Cache Unity installation
      - name: Cache Unity Installation
        uses: actions/cache@v3
        with:
          path: |
            /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}
            ~/Library/Application Support/Unity
          key: unity-${{ runner.os }}-${{ vars.UNITY_VERSION }}
          restore-keys: |
            unity-${{ runner.os }}-${{ vars.UNITY_VERSION }}
            unity-${{ runner.os }}-

      # Cache Library folder to skip asset reimport
      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-
            Library

      # Cache iOS build output
      - name: Cache iOS build output
        id: ios-cache
        uses: actions/cache@v4
        with:
          path: build/iOS
          key: ios-build-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            ios-build-${{ runner.os }}-
            ios-build

      # Skip Unity build entirely if cached build exists
      - name: Check if Unity build can be skipped
        id: cache-check
        run: |
          if [ -d "build/iOS" ] && [ "$(ls -A build/iOS)" ]; then
            echo "Cache hit, skipping Unity build step."
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "No cached build found, running Unity build."
          fi

      # Generate Unity build only if cache missed
      - name: Generate Unity build for iOS
        if: ${{ steps.cache-check.outputs.skip_build != 'true' }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: ${{ vars.UNITY_VERSION }}
          versioning: Semantic

      # Save iOS build to cache for future runs
      - name: Save iOS build to cache
        if: ${{ steps.cache-check.outputs.skip_build != 'true' }}
        uses: actions/cache@v4
        with:
          path: build/iOS
          key: ios-build-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      # Upload build artifact for downstream jobs (always)
      - name: Upload Unity build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/iOS


  prepare:
    runs-on: macos-latest

    steps:
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Show current version of Xcode
        run: xcodebuild -version

      - name: Install provising profile
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: com.BaconetaStudios.Setting-The-Stage
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          
      - name: Get provisioning profile UUID
        id: get-uuid
        run: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n1)
          if [[ ! -f "$PROFILE_PATH" ]]; then
            echo "No provisioning profile found!"
            exit 1
          fi
          echo "Found profile: $PROFILE_PATH"
  
          TMP_PLIST=$(mktemp /tmp/profile.XXXXXX.plist)
          security cms -D -i "$PROFILE_PATH" > "$TMP_PLIST"
  
          # Validate the plist has a UUID key
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$TMP_PLIST" 2>/dev/null || true)
          if [[ -z "$UUID" ]]; then
            echo "Could not extract UUID from provisioning profile!"
            exit 1
          fi
  
          echo "Profile UUID: $UUID"
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
  
          rm "$TMP_PLIST"
          
      - name: Debug provisioning profile
        run: |
          echo "Profile UUID: ${{ steps.get-uuid.outputs.uuid }}"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          security find-identity -v -p codesigning

      - name: List installed provisioning profiles
        run: |
          echo "Provisioning profiles in ~/Library/MobileDevice/Provisioning Profiles:"
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          echo ""
          echo "Extracting metadata:"
          for p in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "File: $p"
            security cms -D -i "$p" | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin || true
            security cms -D -i "$p" | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin || true
            security cms -D -i "$p" | /usr/libexec/PlistBuddy -c "Print :ApplicationIdentifierPrefix" /dev/stdin || true
            echo "-----"
          done

      - name: Upload provisioning profile for later jobs
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-profile
          path: ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision

  xcode-build-ios:
    runs-on: macos-latest
    needs: [unity-build-ios, prepare]

    steps:
      - name: Download Unity build
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: build

      - name: Download provisioning profile
        uses: actions/download-artifact@v4
        with:
          name: provisioning-profile
          path: ~/Library/MobileDevice/Provisioning Profiles

      - name: Inspect provisioning profile
        run: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          echo "Profile path: $PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > profile.plist
          /usr/libexec/PlistBuddy -c "Print :UUID" profile.plist
          /usr/libexec/PlistBuddy -c "Print :Name" profile.plist
          /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" profile.plist
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" profile.plist

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_P12_FILE_BASE64 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}

      # - name: Show project signing settings
      #   run: |
      #     /usr/libexec/PlistBuddy -c "Print :objects:Unity-iPhone:buildSettings:CODE_SIGN_STYLE" build/iOS/Unity-iPhone.xcodeproj/project.pbxproj
      #     /usr/libexec/PlistBuddy -c "Print :objects:Unity-iPhone:buildSettings:PROVISIONING_PROFILE_SPECIFIER" build/iOS/Unity-iPhone.xcodeproj/project.pbxproj || true

      - name: Get provisioning profile UUID
        id: get-uuid
        run: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n1)
          UUID=$(basename "$PROFILE_PATH" .mobileprovision)
          echo "uuid=$UUID" >> $GITHUB_OUTPUT

      - name: Get provisioning profile name
        id: get-profile-name
        run: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n1)
          security cms -D -i "$PROFILE_PATH" > profile.plist
          PROFILE_NAME=$( /usr/libexec/PlistBuddy -c "Print :Name" profile.plist )
          echo "Profile name: $PROFILE_NAME"
          echo "profile_name=$PROFILE_NAME" >> $GITHUB_OUTPUT

      - name: Debug provisioning profile
        run: |
          echo "== Provisioning Profiles =="
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles
          echo "== First 20 lines =="
          head -n 20 ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true

      - name: Verify signing certificate in keychain
        run: |
          echo "== Listing all code signing identities in keychain =="
          security find-identity -v -p codesigning || true
          echo ""
          echo "== Check if Apple Distribution cert is present =="
          security find-certificate -a -c "Apple Distribution" -p | openssl x509 -noout -subject -issuer || true

      - name: List PBXNativeTargets in project
        run: |
          PBXPROJ="build/iOS/Unity-iPhone.xcodeproj/project.pbxproj"
          echo "== Project Targets =="
      
          # Extract all PBXNativeTarget UUIDs and Names
          awk '
            /\/\* .* \*\/ = {/ { 
              uuid = $1; 
              getline; 
              if ($0 ~ /isa = PBXNativeTarget;/) { 
                target_line = $0; 
                while (getline && $0 !~ /name =/) {} 
                if ($0 ~ /name =/) { 
                  name = $0; 
                  sub(/.*name = /, "", name); 
                  sub(/;.*/, "", name); 
                  print "Target: " name " (" uuid ")"; 
                } 
              } 
            }
          ' "$PBXPROJ"
        shell: bash

      - name: Patch Xcode project for manual signing (debug)
        shell: bash
        run: |
          set -e
      
          PBXPROJ="build/iOS/Unity-iPhone.xcodeproj/project.pbxproj"
          UUID="${{ steps.get-uuid.outputs.uuid }}"
          PROFILE_NAME="${{ steps.get-profile-name.outputs.profile_name }}"
          TEAM="$(echo "${{ secrets.APPLE_TEAM_ID }}" | xargs)"
      
          echo "== Patching PBXNativeTarget entries for manual signing =="
          echo "Project file: $PBXPROJ"
          echo "Provisioning profile UUID: $UUID"
          echo "Provisioning profile name: $PROFILE_NAME"
          echo "Development team: $TEAM"
      
          # Backup for diff later
          cp "$PBXPROJ" "$PBXPROJ.bak"
      
          # Get project root UUID
          PROJECT_UUID=$(grep -m1 "rootObject" "$PBXPROJ" | sed -E 's/.*= ([A-F0-9]+).*/\1/')
          echo "Project root UUID: $PROJECT_UUID"
      
          # Ensure root attributes dict exists
          /usr/libexec/PlistBuddy -c "Add :objects:$PROJECT_UUID:attributes dict" "$PBXPROJ" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :objects:$PROJECT_UUID:attributes:TargetAttributes dict" "$PBXPROJ" 2>/dev/null || true
      
          echo "== Found PBXNativeTargets =="
      
          targets_scanned=0
          configs_patched=0
      
          # Parse all PBXNativeTarget blocks
          awk '
            /^[[:space:]]*[A-F0-9][A-F0-9]* /\* .* \*\/ = {/ {
              uuid = $1
              name = $0
              sub(/.*\/\* /,"",name)
              sub(/ \*\/.*/,"",name)
              print uuid "|" name
            }
          ' "$PBXPROJ" | while IFS="|" read -r TUUID TNAME; do
            echo "Target: $TNAME (UUID: $TUUID)"
            ((targets_scanned++))
          
            if [[ "$TNAME" != "Unity-iPhone" && "$TNAME" != "UnityFramework" ]]; then
              echo "  Skipping target $TNAME"
              continue
            fi
      
            echo "  Patching target $TNAME"
      
            # Ensure dict exists for this target in TargetAttributes
            /usr/libexec/PlistBuddy -c "Add :objects:$PROJECT_UUID:attributes:TargetAttributes:$TUUID dict" "$PBXPROJ" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :objects:$PROJECT_UUID:attributes:TargetAttributes:$TUUID:ProvisioningStyle Manual" "$PBXPROJ"
      
            # Find build configuration list UUID
            CONFIG_LIST=$(grep -A3 "$TUUID /\* $TNAME \*/" "$PBXPROJ" | grep buildConfigurationList | awk -F ' = ' '{print $2}' | tr -d ' ;')
            if [ -z "$CONFIG_LIST" ]; then
              echo "    ⚠️ No buildConfigurationList found for $TNAME"
              continue
            fi
      
            # Patch each build configuration
            grep -A20 "$CONFIG_LIST" "$PBXPROJ" | grep -E '^[[:space:]]*[A-F0-9]+ /\* ' | awk '{print $1}' | while read CONFIG_ID; do
              if [ -z "$CONFIG_ID" ]; then
                echo "      ⚠️ Empty config ID"
                continue
              fi
      
              echo "    Patching build configuration: $CONFIG_ID"
      
              /usr/libexec/PlistBuddy -c "Add :objects:$CONFIG_ID:buildSettings dict" "$PBXPROJ" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Set :objects:$CONFIG_ID:buildSettings:PROVISIONING_PROFILE_SPECIFIER $PROFILE_NAME" "$PBXPROJ"
              /usr/libexec/PlistBuddy -c "Set :objects:$CONFIG_ID:buildSettings:DEVELOPMENT_TEAM $TEAM" "$PBXPROJ"
              /usr/libexec/PlistBuddy -c "Set :objects:$CONFIG_ID:buildSettings:CODE_SIGN_STYLE Manual" "$PBXPROJ"
              ((configs_patched++))
            done
          done
      
          echo "== Patch complete =="
          echo "Targets scanned: $targets_scanned"
          echo "Build configurations patched: $configs_patched"
      
          echo "== Diff Summary =="
          diff -u "$PBXPROJ.bak" "$PBXPROJ" || true

      - name: Show Xcode build settings for debugging
        run: |
          xcodebuild -project build/iOS/Unity-iPhone.xcodeproj \
          -scheme Unity-iPhone \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/Unity.xarchive \
          -verbose \
          -showBuildSettings | grep -E "(CODE_SIGN|PROVISIONING)"

      - name: Check installed certs
        run: |
          security find-identity -v -p codesigning

      # - name: Generate Xcode build (no signing, debug only)
      #   run: |
      #     xcodebuild -project build/iOS/Unity-iPhone.xcodeproj \
      #     -scheme Unity-iPhone \
      #     -sdk iphoneos \
      #     -configuration Release \
      #     -archivePath build/Unity.xarchive \
      #     Unity-iPhone.CODE_SIGN_IDENTITY="Apple Distribution" \
      #     Unity-iPhone.PROVISIONING_PROFILE_SPECIFIER="${{ steps.get-uuid.outputs.uuid }}" \
      #     Unity-iPhone.DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
      #     archive
          
      - name: Generate Xcode build
        run: |
          TEAM_ID="$(echo "${{ secrets.APPLE_TEAM_ID }}" | xargs)"   # trims whitespace
          xcodebuild -project build/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Unity.xarchive \
            -verbose \
            archive

      - name: Create export options
        run: |
          cat > build/iOS/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Export Xcode build
        run: |
          xcodebuild -exportArchive \
          -archivePath build/Unity.xarchive \
          -exportOptionsPlist build/iOS/exportOptions.plist \
          -exportPath build

      - name: Upload Xcode build
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/*.ipa
