name: Build iOS
run-name: ${{ github.actor }} is building for Apple App Store
on:
  push:
    branches:
      - main
      - '*-build'
  workflow_dispatch:
jobs:
  unity-build-ios:
    runs-on: macos-latest
    steps:
      - name: Handle cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-
            Library

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Build iOS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: 2022.3.62f1
          versioning: Semantic

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/iOS

  xcode-build-ios:
    runs-on: macos-latest
    needs: unity-build-ios

    steps:
      - name: Download unity build
        uses: actions/download-artifact@v5
        with:
          name: ios-build
          path: build/iOS

      - name: Prepare signing
        uses: Apple-Actions/import-codesign-cert@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_P12 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}
          mobileprovision-base64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}

      - name: Build xcode and archive
        run: |
          xcodebuild -project build/iOS/Unity-iPhone.xcodeproj \
          -scheme Unity-iPhone \
          -sdk iphoneos \
          -configuration Release \
          archive -archivePath build/Unity.xarchive
      - name: Export
        run: |
          xcodebuild -exportArchive \
          -archivePath build/Unity.xarchive \
          -exportOptionsPlist build/iOS/exportOptions.plist \
          -exportPath build
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/*.ipa
