name: Build iOS
run-name: ${{ github.actor }} is building for Apple App Store
on:
  push:
    branches:
      - releases
      - '*-build'
  workflow_dispatch:
jobs:
  unity-build-ios:
    runs-on: macos-latest
    steps:
      - name: Process cached Unity Installation
        uses: actions/cache@v3
        with:
          path: |
            /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}
            ~/Library/Application Support/Unity
          key: unity-${{ runner.os }}-${{ vars.UNITY_VERSION }}
          restore-keys: |
            unity-${{ runner.os }}-${{ vars.UNITY_VERSION }}
            unity-${{ runner.os }}-

      - name: Process cached Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-
            Library

      - name: Checkout git repo
        uses: actions/checkout@v5

      - name: Generate Unity build for iOS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: ${{ vars.UNITY_VERSION }}
          versioning: Semantic

      - name: Upload Unity build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/iOS

  xcode-build-ios:
    runs-on: macos-latest
    needs: unity-build-ios

    steps:
      - name: Download Unity build
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: build

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_P12_FILE_BASE64 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}

      - name: Install provising profile
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: com.BaconetaStudios.Setting-The-Stage
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}

      - name: Get provisioning profile UUID
        id: get-uuid
        run: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n1)
          UUID=$(basename "$PROFILE_PATH" .mobileprovision)
          echo "uuid=$UUID" >> $GITHUB_OUTPUT

      - name: Patch Unity-iPhone target for manual signing
        id: patch-target
        run: |
          PBXPROJ="build/iOS/Unity-iPhone.xcodeproj/project.pbxproj"
          # Get the target UUID for Unity-iPhone
          TARGET_UUID=$(grep -E '^[[:space:]]*[0-9A-F]{24} /\* Unity-iPhone \*/ =' "$PBXPROJ" | awk '{print $1}')
          echo "Unity-iPhone target UUID: $TARGET_UUID"
          # Get the project UUID
          PROJECT_UUID=$(grep -E 'rootObject = [0-9A-F]{24}' "$PBXPROJ" | sed -E 's/.*rootObject = ([0-9A-F]{24}).*/\1/')
          echo "Project UUID: $PROJECT_UUID"
          # Create TargetAttributes structure if it doesn't exist
          /usr/libexec/PlistBuddy -c "Add :objects:$PROJECT_UUID:attributes:TargetAttributes dict" "$PBXPROJ" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :objects:$PROJECT_UUID:attributes:TargetAttributes:$TARGET_UUID dict" "$PBXPROJ" 2>/dev/null || true
          # Set ProvisioningStyle to Manual
          /usr/libexec/PlistBuddy -c "Set :objects:$PROJECT_UUID:attributes:TargetAttributes:$TARGET_UUID:ProvisioningStyle Manual" "$PBXPROJ"
          # Remove any leftover provisioning profile specifier
          /usr/libexec/PlistBuddy -c "Delete :objects:$PROJECT_UUID:attributes:TargetAttributes:$TARGET_UUID:PROVISIONING_PROFILE_SPECIFIER" "$PBXPROJ" 2>/dev/null || true

      - name: Generate Xcode build
        run: |
          xcodebuild -project build/iOS/Unity-iPhone.xcodeproj \
          -scheme Unity-iPhone \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/Unity.xarchive \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          PROVISIONING_PROFILE_SPECIFIER="${{ steps.get-uuid.outputs.uuid }}" \
          DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
          archive

      - name: Create export options
        run: |
          cat > build/iOS/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Export Xcode build
        run: |
          xcodebuild -exportArchive \
          -archivePath build/Unity.xarchive \
          -exportOptionsPlist build/iOS/exportOptions.plist \
          -exportPath build

      - name: Upload Xcode build
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/*.ipa
