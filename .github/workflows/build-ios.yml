name: Build iOS
run-name: ${{ github.actor }} is building for Apple App Store
on:
  push:
    branches:
      - releases
      - '*-build'
  workflow_dispatch:
jobs:
  unity-build-ios:
    runs-on: macos-latest
    steps:
      - name: Process cached Unity Installation
        uses: actions/cache@v3
        with:
          path: |
            /Applications/Unity/Hub/Editor/${{ vars.UNITY_VERSION }}
            ~/Library/Application Support/Unity
          key: unity-${{ runner.os }}-${{ vars.UNITY_VERSION }}
          restore-keys: |
            unity-${{ runner.os }}-${{ vars.UNITY_VERSION }}
            unity-${{ runner.os }}-

      - name: Process cached Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-
            Library

      - name: Checkout git repo
        uses: actions/checkout@v5

      - name: Generate Unity build for iOS
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: ${{ vars.UNITY_VERSION }}
          versioning: Semantic

      - name: Upload Unity build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/iOS

  prepare:
    runs-on: macos-latest

    steps:
      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Show current version of Xcode
        run: xcodebuild -version

      - name: Install provising profile
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: com.BaconetaStudios.Setting-The-Stage
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          
      - name: Get provisioning profile UUID
        id: get-uuid
        run: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n1)
          if [[ ! -f "$PROFILE_PATH" ]]; then
            echo "No provisioning profile found!"
            exit 1
          fi
          echo "Found profile: $PROFILE_PATH"
  
          TMP_PLIST=$(mktemp /tmp/profile.XXXXXX.plist)
          security cms -D -i "$PROFILE_PATH" > "$TMP_PLIST"
  
          # Validate the plist has a UUID key
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$TMP_PLIST" 2>/dev/null || true)
          if [[ -z "$UUID" ]]; then
            echo "Could not extract UUID from provisioning profile!"
            exit 1
          fi
  
          echo "Profile UUID: $UUID"
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
  
          rm "$TMP_PLIST"
          
      - name: Debug provisioning profile
        run: |
          echo "Profile UUID: ${{ steps.get-uuid.outputs.uuid }}"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          security find-identity -v -p codesigning

      - name: List installed provisioning profiles
        run: |
          echo "Provisioning profiles in ~/Library/MobileDevice/Provisioning Profiles:"
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          echo ""
          echo "Extracting metadata:"
          for p in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "File: $p"
            security cms -D -i "$p" | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin || true
            security cms -D -i "$p" | /usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin || true
            security cms -D -i "$p" | /usr/libexec/PlistBuddy -c "Print :ApplicationIdentifierPrefix" /dev/stdin || true
            echo "-----"
          done

      - name: Upload provisioning profile for later jobs
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-profile
          path: ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision

  xcode-build-ios:
    runs-on: macos-latest
    needs: [unity-build-ios, prepare]

    steps:
      - name: Download Unity build
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: build

      - name: Download provisioning profile
        uses: actions/download-artifact@v4
        with:
          name: provisioning-profile
          path: ~/Library/MobileDevice/Provisioning Profiles

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_P12_FILE_BASE64 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}

      # - name: Show project signing settings
      #   run: |
      #     /usr/libexec/PlistBuddy -c "Print :objects:Unity-iPhone:buildSettings:CODE_SIGN_STYLE" build/iOS/Unity-iPhone.xcodeproj/project.pbxproj
      #     /usr/libexec/PlistBuddy -c "Print :objects:Unity-iPhone:buildSettings:PROVISIONING_PROFILE_SPECIFIER" build/iOS/Unity-iPhone.xcodeproj/project.pbxproj || true

      - name: Get provisioning profile UUID
        id: get-uuid
        run: |
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n1)
          UUID=$(basename "$PROFILE_PATH" .mobileprovision)
          echo "uuid=$UUID" >> $GITHUB_OUTPUT

      - name: Debug provisioning profile
        run: |
          echo "== Provisioning Profiles =="
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles
          echo "== First 20 lines =="
          head -n 20 ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true

      - name: Verify signing certificate in keychain
        run: |
          echo "== Listing all code signing identities in keychain =="
          security find-identity -v -p codesigning || true
          echo ""
          echo "== Check if Apple Distribution cert is present =="
          security find-certificate -a -c "Apple Distribution" -p | openssl x509 -noout -subject -issuer || true

      - name: List Xcode project targets
        run: |
          PBXPROJ="build/iOS/Unity-iPhone.xcodeproj/project.pbxproj"
          echo "== Project Targets =="
          grep -E '^[[:space:]]*[0-9A-F]{24} /\* .* \*/ = {isa = PBXNativeTarget;' "$PBXPROJ" \
            | sed -E 's/^[[:space:]]*([0-9A-F]{24}) /\1/' \
            | while read -r line; do
                UUID=$(echo "$line" | awk '{print $1}')
                NAME=$(echo "$line" | sed -E 's/.*\* (.*) \*\/.*/\1/')
                echo "Target: $NAME ($UUID)"
              done

      - name: Patch Xcode project for manual signing
        run: |
          PBXPROJ="build/iOS/Unity-iPhone.xcodeproj/project.pbxproj"
          UUID="ecd1e226-5886-4461-91e8-a8988efbd2a8"
          TEAM="***"  # replace with your team ID
      
          echo "Patching PBXNativeTarget entries for manual signing..."
      
          # Extract all PBXNativeTarget entries using multiline-aware awk
          awk '/^[[:space:]]*[0-9A-F]{24} .* = {/,/};/ {
            if ($0 ~ /isa = PBXNativeTarget;/) target_block=1
            if (target_block) print
            if ($0 ~ /};/ && target_block) {target_block=0; print "---END---"}
          }' "$PBXPROJ" | while IFS= read -r block; do
            # Skip separator lines
            [[ "$block" == "---END---" ]] && continue
      
            # Extract UUID and name
            if [[ "$block" =~ ([0-9A-F]{24})\ /\*.*\*/ ]]; then
              TUUID="${BASH_REMATCH[1]}"
            fi
            if [[ "$block" =~ name\ =\ \"?([^\";]+)\"?\; ]]; then
              TNAME="${BASH_REMATCH[1]}"
            fi
      
            # Only patch targets we care about
            if [[ "$TNAME" == "Unity-iPhone" || "$TNAME" == "UnityFramework" ]]; then
              echo "Patching target $TNAME ($TUUID)..."
      
              # Ensure TargetAttributes dict exists
              /usr/libexec/PlistBuddy -c "Add :objects:$PROJECT_UUID:attributes:TargetAttributes dict" "$PBXPROJ" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :objects:$PROJECT_UUID:attributes:TargetAttributes:$TUUID dict" "$PBXPROJ" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Set :objects:$PROJECT_UUID:attributes:TargetAttributes:$TUUID:ProvisioningStyle Manual" "$PBXPROJ"
      
              # Patch buildSettings for each configuration
              CONFIGS=$(grep -A20 "$TUUID" "$PBXPROJ" | grep "buildConfigurationList" | awk -F' = ' '{print $2}' | tr -d ' ;')
              for CONFIG_ID in $CONFIGS; do
                /usr/libexec/PlistBuddy -c "Add :objects:$CONFIG_ID:buildSettings dict" "$PBXPROJ" 2>/dev/null || true
                /usr/libexec/PlistBuddy -c "Set :objects:$CONFIG_ID:buildSettings:PROVISIONING_PROFILE_SPECIFIER $UUID" "$PBXPROJ"
                /usr/libexec/PlistBuddy -c "Set :objects:$CONFIG_ID:buildSettings:DEVELOPMENT_TEAM $TEAM" "$PBXPROJ"
                /usr/libexec/PlistBuddy -c "Set :objects:$CONFIG_ID:buildSettings:CODE_SIGN_STYLE Manual" "$PBXPROJ"
              done
            fi
          done
          shell: /bin/bash -e

      - name: Show Xcode build settings for debugging
        run: |
          xcodebuild -project build/iOS/Unity-iPhone.xcodeproj \
          -scheme Unity-iPhone \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/Unity.xarchive \
          -verbose \
          -showBuildSettings | grep -E "(CODE_SIGN|PROVISIONING)"

      # - name: Generate Xcode build (no signing, debug only)
      #   run: |
      #     xcodebuild -project build/iOS/Unity-iPhone.xcodeproj \
      #     -scheme Unity-iPhone \
      #     -sdk iphoneos \
      #     -configuration Release \
      #     -archivePath build/Unity.xarchive \
      #     Unity-iPhone.CODE_SIGN_IDENTITY="Apple Distribution" \
      #     Unity-iPhone.PROVISIONING_PROFILE_SPECIFIER="${{ steps.get-uuid.outputs.uuid }}" \
      #     Unity-iPhone.DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
      #     archive
          
      - name: Generate Xcode build
        run: |
          xcodebuild -project build/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Unity.xarchive \
            -verbose \
            UnityFramework.CODE_SIGN_STYLE=Automatic \
            Unity-iPhone.CODE_SIGN_STYLE=Manual \
            Unity-iPhone.CODE_SIGN_IDENTITY="Apple Distribution" \
            Unity-iPhone.PROVISIONING_PROFILE_SPECIFIER="${{ steps.get-uuid.outputs.uuid }}" \
            Unity-iPhone.DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            archive

      - name: Create export options
        run: |
          cat > build/iOS/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Export Xcode build
        run: |
          xcodebuild -exportArchive \
          -archivePath build/Unity.xarchive \
          -exportOptionsPlist build/iOS/exportOptions.plist \
          -exportPath build

      - name: Upload Xcode build
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/*.ipa
