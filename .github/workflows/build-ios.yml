#          ' "$PBXPROJ"
#        shell: bash

      - name: Show Xcode build settings for debugging
        run: |
          xcodebuild -project build/iOS/Unity-iPhone.xcodeproj \
          -scheme Unity-iPhone \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/Unity.xarchive \
          -verbose \
          -showBuildSettings | grep -E "(CODE_SIGN|PROVISIONING)"

      - name: Check installed certs
        run: |
          security find-identity -v -p codesigning

      - name: Generate Xcode build
        run: |
          xcodebuild -project build/iOS/Unity-iPhone.xcodeproj \
          -scheme Unity-iPhone \
          -sdk iphoneos \
          -configuration Release \
          -archivePath build/Unity.xcarchive \
          archive

      - name: Create export options file
        run: |
          cat > build/iOS/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>          
            <key>method</key>
            <string>app-store-connect</string>
          
            <key>teamID</key>
            <string>3W74XNV66H</string>
          
            <key>signingStyle</key>
            <string>manual</string>
          
            <key>provisioningProfiles</key>
            <dict>
              <key>com.baconetastudios.SettingTheStage</key>
              <string>SettingTheStage-Release-AppStore</string>
            </dict>
          
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
          
            <key>stripSwiftSymbols</key>
            <true/>
          
            <key>uploadSymbols</key>
            <true/>
          
            <key>compileBitcode</key>
            <false/>
          
            <key>uploadBitcode</key>
            <false/>
          
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

      - name: Attempt to find .xarchive files
        run: |
          find ~ -type f -name "*.xarchive"

      - name: Export Xcode build archive
        run: |
          xcodebuild -exportArchive \
          -archivePath build/Unity.xcarchive \
          -exportPath build \
          -exportOptionsPlist build/iOS/exportOptions.plist \

      - name: List contents of build directory
        run: ls -R build

      - name: Upload Xcode build
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/*.ipa

  upload-to-testflight:
    runs-on: macos-latest
    if: github.ref == 'refs/heads/releases'
    needs: [xcode-build-ios]
    steps:
      - name: Fetch build archive
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ./
          run-id: ${{ github.event.workflow_run.id }}

      - name: Save API key to file
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID}}.p8

      - name: Upload to TestFlight
        run: |
          xcrun altool \
          --upload-package SettingTheStage.ipa \
          --apiKey ${{ secrets.APPLE_API_KEY_ID }} \
          --apiIssuer ${{ secrets.APPLE_API_ISSUER_ID }} \
          --apple-id 6736443805 \
          --bundle-id com.baconetastudios.SettingTheStage \
          --bundle-version ${{ github.run_number }} \
          --bundle-short-version-string ${{ vars.APP_VERSION }} \
          -t ios
